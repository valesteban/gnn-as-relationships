# Configuración central de gnn-as-relationships.
experimento:
  # Nombre corrida
  nombre: prueba e2e
  salida: /media/vale/KINGSTON/LAB/gnn-as-relationships/resultados_gnn

rutas:
  # Grafo de as-level-internet-graph:
  # <Dir>/experimentos/experimento<N>/grafos/<año>/<mes>/<AAAAMMDDTHHMM>/
  grafo_dir: /media/vale/KINGSTON/as-level-internet-graph/experimentos/experimento7/grafos/2025/09/20250916T0800

  # Snapshots CAIDA AS-Relationships (AAAAMM01.as-rel.txt.bz2); 
  # https://publicdata.caida.org/datasets/as-relationships/serial-1/
  caida_dir: /media/vale/KINGSTON/LAB/CAIDA/CAIDA_AS_Relationships/Serial_1

  # Grafo externo 2022 con atributos del paper: 
  # Paper: https://arxiv.org/pdf/2210.14189
  # github: https://github.com/dpgiakatos/gnn-internet-data
  internetgraph_file: /media/vale/KINGSTON/LAB/gnn-as-relationships/InternetGNNData2022/caida/caida.bin

comunes:
  seed: 42  # splits, pesos iniciales, dropout, caminatas y orden de mini-batches
  class_names: [P2P, C2P, P2C]
  split: {train_size: 0.7,
          val_size: 0.15,
          balance_mode: proportional}
  class_weights: true   # pondera la cross-entropy por la inversa de la frecuencia de cada clase en train
  
  
# Clasificador MLP
MLP:
  hidden: 256
  dropout: 0.3
  lr: 0.001
  patience: 50
  batch: 512
  val_size: 0.2

# ---------------------------------------------------------------------------
# ENFOQUES END TO END: 
# ---------------------------------------------------------------------------
global_config_endtoend:
  lr: 0.001
  hidden_dim: 256
  out_dim: 128
  epochs: 100
  patience: 120
  weight_decay: 0.0005
  dropout: 0.3
  num_heads: 1
  scheduler: {T_0: 100, T_mult: 2}
  class_weights: true 
  # GAT full-batch (Casos 0, 1, 4 y comparación): con hidden 256 / out 128 necesita ~11-13 GB
  # y la GPU tiene 8 GB, así que GAT usa sus propias dimensiones (GCN/GraphSAGE siguen con
  # hidden_dim/out_dim). GAT con muestreo (Caso 2) usa hidden_dim/out_dim.
  gat_hidden_dim: 64
  gat_out_dim: 32
  batch_size: 1024
  num_neighbors: 15   # GraphSAGE/GAT con muestreo
  # split_edges_classification: train_size + val_size < 1.0 (el resto es test)
  
  
  # CASO 2: Random Neighbour Sampling
  n_neighbors: 15
  batch_size_caso2: 1024

  # CASO 3: ClusterGCN
  num_parts: 1000
  batch_size_caso3: 20

  # CASO 4: features aleatorias
  random_features: {dim: 64, 
                    std: 0.05, 
                    mode: uniform}

# ---------------------------------------------------------------------------
# ENFOQUES POR PARTES: 
# ---------------------------------------------------------------------------
global_config_por_partes:
  cases: [0] 
  lr: 0.0005
  hidden_dim: 256
  out_dim: 128
  dropout: 0.3
  epochs: 500
  patience: 80
  weight_decay: 0.0005
  scheduler: {T_0: 100, T_mult: 2}
  label_smooth: 0.05  # evita que el modelo sea "demasiado seguro" de clases erróneas
  # Opcionales (los notebooks usan estos valores por defecto):
  # deepwalk_epochs: 50
  # bgp2vec_max_routes: 5000000
  # bgp2vec_count_routes: true
  # ann_epochs: 200


  # DeepWalk (Node2Vec con p = q = 1)
  deepwalk:
    embedding_dim: 32
    walk_length: 40
    context_size: 2
    walks_per_node: 1
    p: 1.0
    q: 1.0
    num_negative_samples: 5
    batch_size: 128
    lr: 0.01

  # BGP2Vec
  bgp2vec_epochs: 1
  bgp2vec_test_limit: 27000000   # cantidad de rutas


